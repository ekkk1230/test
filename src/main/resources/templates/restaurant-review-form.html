<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form th:action="@{/restaurants/{id}/reviews/new(id=${id})}" method="post">
    <label>
        맛집이름 <input type="text" readonly th:value="${storeName}">
    </label>
    <label>
        평점 <input type="text" name="restaurantRating" th:value="${draftRating}">
    </label>
    <label>
        <p>후기 본문</p>
        <textarea name="restaurantComment" th:text="${draftComment}"></textarea>
    </label>
    <button type="submit">제출</button>
</form>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>
<p th:text="${storeName}"></p>
<p th:text="${restaurantRating}"></p>
<p th:text="${restaurantComment}"></p>
</body>
</html>
